# Dependabot: one grouped PR for security fixes instead of one PR per package.
# Routine version-bump PRs are off (open-pull-requests-limit: 0); security updates are not affected by that limit.
# Set up from hq on 2026-11-18 to cut notification noise.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      security-fixes:
        applies-to: security-updates
        patterns:
          - "*"
